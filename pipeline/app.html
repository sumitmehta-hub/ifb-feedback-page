<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiring Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#8644f0;--brand-d:#6a2bd6;--brand-dd:#2b1160;--brand-l:#f1ebfe;--brand-ll:#f8f5ff;--brand-line:#dccdfb;
  --ink:#1b1530;--ink2:#3f3f3f;--muted:#5d5d5d;--line:#e6e2ef;--bg:#f6f4fb;--panel:#fbfaff;
  --ok:#1f7a00;--ok-l:#e7f6df;--warn:#9a5200;--warn-l:#fff1dc;--bad:#c8102e;--bad-l:#ffe8ec;
  --r:14px;--shadow:0 1px 2px rgba(27,21,48,.06),0 4px 14px rgba(27,21,48,.05);--shadow-h:0 2px 4px rgba(27,21,48,.08),0 10px 26px rgba(106,43,214,.14);--side:290px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand-d);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #b99bf7;outline-offset:2px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;font-weight:700;color:var(--muted);background:#fff}
.top{position:sticky;top:0;z-index:20;height:56px;background:linear-gradient(100deg,var(--brand-dd) 0%,#4a1fa8 55%,var(--brand) 100%);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;box-shadow:0 2px 10px rgba(43,17,96,.25)}
.logo{width:32px;height:32px;border-radius:10px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:17px}
.top .t1{font-weight:800;font-size:16px;line-height:1.1}.top .t2{font-size:11.5px;opacity:.8}
.top .sp{flex:1}
.me{display:flex;align-items:center;gap:10px;font-size:12.5px;text-align:right}
.me .av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:700}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:700;color:var(--ink);transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--brand-line);background:var(--brand-ll)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(134,68,240,.3)}.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 14px}.btn.ghost:hover{background:rgba(255,255,255,.22)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.shell{display:grid;grid-template-columns:var(--side) 1fr;height:calc(100vh - 56px)}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side .hd{padding:14px 14px 8px}
.side .hd h2{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side .list{overflow-y:auto;padding:4px 8px 14px;flex:1}
.home-link{display:flex;gap:8px;word-spacing:3px;align-items:center;width:100%;border:0;background:none;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:700;color:var(--brand-d);text-align:left}
.home-link:hover,.home-link[aria-current=true]{background:#fff;box-shadow:var(--shadow)}
.grp{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-d);margin:12px 8px 6px}
.ji{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink)}
.ji:hover{background:#fff;box-shadow:var(--shadow)}
.ji[aria-current=true]{background:#fff;box-shadow:inset 3px 0 0 var(--brand),var(--shadow)}
.ji .dot{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--brand-l);color:var(--brand-d)}
.ji .tx{flex:1;min-width:0}
.ji .tt{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ji .ss{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ji .n{font-size:12px;font-weight:800;color:var(--muted)}
.main{overflow:auto;min-width:0;padding:18px 22px 30px}
.search{position:relative;display:block}
.search input{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:8px 34px 8px 36px;background:#fff}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(134,68,240,.12);outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .k{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink2)}
.chk input{accent-color:var(--brand)}
.hint{color:var(--muted);font-size:13px}
.loading{color:var(--muted);text-align:center;padding:60px 10px}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--brand-l);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:10px}@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--muted);text-align:center;padding:36px 16px;background:#fff;border:1.5px dashed var(--line);border-radius:var(--r)}
.card.err{border:1px solid #f5b8c3;background:var(--bad-l);color:var(--bad);font-weight:600;border-radius:var(--r);padding:16px}
.jh{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.jh h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.jh .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px;align-items:center}
.jh .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:800;background:var(--brand-l);color:var(--brand-d)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:16px 0 12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.tile small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile b{font-size:24px;font-weight:800;line-height:1.2}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.toolbar .search{flex:1;min-width:220px}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fc{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;background:#fff;border:1.5px solid var(--line);cursor:pointer;color:var(--ink)}
.fc i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.fc b{font-weight:800}
.fc[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.fc.clear{color:var(--brand-d);border-style:dashed}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:1 0 250px;max-width:360px;background:#efecf6;border-radius:var(--r);padding:10px;max-height:calc(100vh - 330px);display:flex;flex-direction:column}
.col h4{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.col h4 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.col h4 span{margin-left:auto;background:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.col .cards{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.cc{text-align:left;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);width:100%;transition:box-shadow .15s,transform .15s}
.cc:hover{box-shadow:var(--shadow-h);transform:translateY(-1px)}
.cc[aria-current=true]{border-color:var(--brand);border-left-color:var(--c);box-shadow:0 0 0 3px rgba(134,68,240,.18)}
.cc .nm{font-weight:800;font-size:14px}
.cc .s{font-size:12.5px;color:var(--ink2);margin-top:1px}
.cc .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--muted)}
.more{text-align:center;font-size:12.5px;color:var(--muted);padding:6px}
.tblw{overflow:auto;max-height:calc(100vh - 330px);border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);background:#fff}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--brand-ll);text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.r{cursor:pointer}.tbl tr.r:hover td{background:var(--brand-ll)}
.tbl tr[aria-current=true] td{background:var(--brand-l)}
.tbl td.nm{font-weight:800}
.stdot{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.stdot i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.hero{background:linear-gradient(135deg,#fff,var(--brand-ll));border:1px solid var(--brand-line);border-radius:18px;padding:22px 24px;margin-bottom:16px}
.hero h1{margin:0;font-size:24px;font-weight:800}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.job{text-align:left;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column;gap:6px}
.job:hover{box-shadow:var(--shadow-h);transform:translateY(-1px);border-color:var(--brand-line)}
.job .t{font-weight:800;font-size:15px;line-height:1.3}
.job .n b{font-size:22px;font-weight:800}.job .n span{color:var(--muted);font-size:12.5px;margin-left:5px}
.job .rec{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{position:fixed;inset:0;background:rgba(27,21,48,.32);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(700px,100%);background:var(--bg);z-index:31;box-shadow:-10px 0 40px rgba(27,21,48,.2);display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.dnav{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.dnav .sp{flex:1}
.dh{background:#fff;padding:14px 20px 12px;display:flex;gap:14px;align-items:flex-start}
.cav{flex:none;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px;background:var(--brand-l);color:var(--brand-d)}
.dh h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:11px 12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--brand-d);border-bottom-color:var(--brand)}
.db{overflow-y:auto;padding:16px 20px 40px;flex:1}
.nx{background:#fff;border:1px solid var(--brand-line);border-radius:14px;padding:14px;margin:0 0 14px;box-shadow:var(--shadow)}
.nx h4{margin:0 0 2px;font-size:14px}.nx .nxsteps{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.ok{background:var(--ok-l);border-color:#bfe3ad;color:var(--ok)}.btn.bad{background:var(--bad-l);border-color:#f5b8c3;color:var(--bad)}
.nxgate{background:var(--warn-l);border:1px solid #f3d3a5;color:#5a3500;border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.nxgate>span{flex:1 1 240px;min-width:0}
.nxform{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.nxform label{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.nxform input,.nxform select,.nxform textarea{font:inherit;font-weight:500;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
.nxform textarea{min-height:70px;resize:vertical}.nxform .row2{display:grid;grid-template-columns:1fr 140px;gap:10px}
.nxnote{font-size:12.5px;color:var(--ink2);background:var(--panel);border-radius:10px;padding:8px 10px}
.spin.sm{width:12px;height:12px;border-width:2px;vertical-align:-2px;margin-right:4px}
.trow{grid-template-columns:128px minmax(0,1fr) auto}.trow .tm2 .who{white-space:normal}.trow .acts{grid-column:2/-1;justify-content:flex-start}.trow .acts:empty{display:none}
.qrow{flex-wrap:wrap}.qrow>div:first-child{flex:1 1 240px}.qrow .who{white-space:normal}.qrow .acts{margin-left:auto}
.skipf{display:grid;gap:8px;padding:10px 12px 12px;background:var(--panel);border-bottom:1px solid var(--line)}.skipf label{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink2)}.skipf textarea{font:inherit;font-weight:500;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.btn.ghostb{background:none;border-color:transparent;color:var(--ink2)}.btn.ghostb:hover{border-color:var(--line)}
@media (max-width:980px){.skipf{padding-left:12px}}
.kx{display:block;font-style:normal;font-size:11.5px;color:var(--ink2);margin-top:6px;line-height:1.35;border-top:1px dashed var(--line);padding-top:6px}
.why{margin:12px 0 0;font-size:12.5px;color:var(--ink2);background:var(--panel);border-radius:10px;padding:8px 10px;line-height:1.45}.why b{color:var(--ink)}
.ph,.ptr{grid-template-columns:84px 52px 64px minmax(0,1fr) 150px!important}
.ptab .pbar{height:24px;background:#efe9fb;border-radius:6px;display:flex;align-items:center}.ptab .pbar i{position:relative;display:flex;align-items:center;height:100%;background:#6a2bd6;border-radius:6px}
.ptab .pbar em{font-style:normal;font-weight:800;font-size:12.5px;color:#fff;padding-left:8px;position:static}.ptab .pbar em.out{color:var(--ink);padding-left:6px}
.ptab .ptr.small .pbar i{background:#a99bc4}.ptr.small b{color:var(--muted)}.tag2{display:inline-block;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:0 6px;margin-left:4px}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis .kpi{position:relative;border-top:4px solid var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 7%,#fff),#fff 60%);padding-top:14px}
.kpis .kpi .ki{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.kpis .kpi small{padding-right:36px}.kpis .kpi b{color:color-mix(in srgb,var(--c) 70%,#1b1530)}
section.dsec{border-top:4px solid var(--c)}.dsh h3{display:flex;align-items:center;gap:8px}.dsh .ci{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.wbars .wb i{background:linear-gradient(180deg,#9b5cf5,#5b21b6)}.wbars .wb.cur i{background:repeating-linear-gradient(135deg,#c9b3f7 0 6px,#ddd0fb 6px 12px)}
.calls .call{border-top:4px solid var(--bad)}.calls .call.ok{border-top-color:var(--ok)}
.dnw{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.dn{width:170px;height:170px;flex:none}.dnl{flex:1;min-width:180px;display:grid;gap:4px}.dnl div{display:grid;grid-template-columns:12px 1fr auto 40px;gap:8px;align-items:center;font-size:13px}.dnl i{width:12px;height:12px;border-radius:3px}.dnl b{color:var(--ink)}.dnl em{font-style:normal;color:var(--muted);font-size:12px;text-align:right}
.fun{display:grid;gap:2px}.frow{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;font-size:13px}.frow .fl{font-weight:700;color:var(--ink)}.frow .ftr{height:22px;background:#f3effb;border-radius:6px;overflow:hidden}.frow i{display:block;height:100%;border-radius:6px}.frow b{text-align:right;color:var(--ink)}
.fdrop{font-size:11.5px;font-weight:700;color:var(--muted);padding-left:140px;line-height:1.3}
.gbars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;height:190px;align-items:end}.gb{display:flex;flex-direction:column;align-items:center;height:100%}.gb .gp{flex:1;width:100%;display:flex;gap:3px;align-items:flex-end;justify-content:center}
.gb .gp span{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;width:42%}.gb .gp b{font-size:11px;color:var(--ink)}.gb i{display:block;width:100%;border-radius:4px 4px 0 0}.gb i.h{background:#6a2bd6}.gb i.f{background:#14b8a6}
.gb.cur i.h{background:repeating-linear-gradient(135deg,#c9b3f7 0 4px,#ddd0fb 4px 8px)}.gb.cur i.f{background:repeating-linear-gradient(135deg,#99e6dc 0 4px,#c4f1ea 4px 8px)}.gb small{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:12.5px}.heat th{font-size:11px;color:var(--muted);font-weight:800;text-align:center;padding:2px 4px;white-space:nowrap}.heat th:first-child{text-align:left}
.heat td{text-align:center;border-radius:6px;padding:7px 4px;font-weight:800;min-width:44px}.heat td:first-child{text-align:left;background:none;padding-left:0;white-space:nowrap}.heat td.ht{background:var(--panel)}
@media (max-width:560px){.frow{grid-template-columns:96px 1fr 40px}.fdrop{padding-left:106px}.dn{width:140px;height:140px}}
.pvbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff4e5;border:1px solid #f3c98b;color:#5a3500;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}.pvbar b{color:#1b1530}.pvbar .btn{margin-left:auto}
.vas{display:grid;gap:4px;margin:2px 2px 10px;padding:10px;background:#fff;border:1px dashed var(--brand-line);border-radius:12px}.vas label{font-size:12px;font-weight:800;color:var(--brand-d)}.vas select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-weight:700;background:#fff}
body.viewer [data-qremind],body.viewer [data-qfile],body.viewer [data-qskip],body.viewer [data-step],body.viewer [data-fileeval],body.viewer [data-remind],body.viewer #nxgo,body.viewer [data-ivact]{display:none!important}
body.previewing [data-qremind],body.previewing [data-qfile],body.previewing [data-qskip],body.previewing [data-step],body.previewing [data-fileeval],body.previewing [data-remind],body.previewing #nxgo,body.previewing [data-ivact]{pointer-events:none;opacity:.4}
@keyframes fanIn{from{opacity:0;transform:perspective(900px) translateY(18px) rotateX(-14deg) translateZ(-40px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---- custom dropdowns (26 Nov) ---- */
(function(){
  var pop = null, cur = null;
  function nrm(t){ return String(t || '').toLowerCase().replace(/[^a-z0-9@.]+/g, ''); }

  function lab(sel){ var o = sel.options[sel.selectedIndex]; return o ? o.textContent : ''; }
  function sync(sel){ var b = sel._dd; if(!b) return; var t = lab(sel) || 'Choose…'; var l = b.firstChild; if(l.textContent !== t) l.textContent = t; b.title = t; b.disabled = sel.disabled; }
  function nameOf(sel){ if(sel.getAttribute('aria-label')) return sel.getAttribute('aria-label'); var l = sel.closest('label') || (sel.id && document.querySelector('label[for="' + sel.id + '"]')); return l ? (l.firstChild && l.firstChild.nodeType === 3 ? l.firstChild.textContent : l.textContent).trim() : ''; }

    var n = nameOf(sel); if(n) b.setAttribute('aria-label', n + ': ' + lab(sel));

    b.innerHTML = '<span class="dd-l"></span>'; sel._dd = b; sel.classList.add('dd-n'); sel.parentNode.insertBefore(b, sel); sync(sel);
    b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); if(cur === sel) close(true); else open(sel); });
    b.addEventListener('keydown', function(e){ if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); open(sel); } });
  }
  function opts(){ return Array.prototype.slice.call(pop.querySelectorAll('.dd-o:not(:disabled)')); }
  function fill(q){
    var list = pop.querySelector('.dd-list'), h = '', k = nrm(q);
    // matches that start with the typed text come first ("2:30 p" → 2:30 pm before 12:30 pm), then word starts, then anywhere
    var m = []; Array.prototype.forEach.call(cur.options, function(o, i){ if(o.hidden) return; var t = nrm(o.textContent), at = k ? t.indexOf(k) : 0; if(at < 0) return;
      m.push({ o: o, i: i, r: !k || at === 0 ? 0 : /[\s(·,-]/.test(t.charAt(at - 1)) ? 1 : 2 }); });
    m.sort(function(x, y){ return (x.r - y.r) || (x.i - y.i); });
    m.forEach(function(x){ var o = x.o, i = x.i, t = o.textContent, on = i === cur.selectedIndex;
      h += '<button type="button" role="option" class="dd-o' + (on ? ' on' : '') + '" data-i="' + i + '" aria-selected="' + on + '" title="' + esc(t) + '"' + (o.disabled ? ' disabled' : '') + '>' + esc(t) + '</button>'; });

  }
  function place(){
    var b = cur._dd, r = b.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight, list = pop.querySelector('.dd-list'), q = pop.querySelector('.dd-q');
    var w = Math.min(Math.max(r.width, 200), 380, vw - 16); pop.style.width = w + 'px'; pop.style.left = Math.max(8, Math.min(r.left, vw - w - 8)) + 'px';
    var below = vh - r.bottom - 12, above = r.top - 12, up = below < 220 && above > below, room = (up ? above : below) - (q ? 52 : 14);
    list.style.maxHeight = Math.max(120, Math.min(320, room)) + 'px';
    if(up){ pop.style.top = ''; pop.style.bottom = (vh - r.top + 4) + 'px'; } else { pop.style.bottom = ''; pop.style.top = (r.bottom + 4) + 'px'; }
  }
  function open(sel){
    close(); if(sel.disabled) return; cur = sel; var many = sel.options.length > 10;
    pop = document.createElement('div'); pop.className = 'dd-pop';
    pop.innerHTML = (many ? '<input class="dd-q" type="search" placeholder="Type to search…" aria-label="Search" autocomplete="off">' : '') + '<div class="dd-list" role="listbox"></div>';
    document.body.appendChild(pop); fill(''); place(); sel._dd.setAttribute('aria-expanded', 'true');
    var list = pop.querySelector('.dd-list'), on = list.querySelector('.on'); if(on) list.scrollTop = on.offsetTop - list.clientHeight / 2 + on.offsetHeight / 2;

    if(q){ q.focus(); q.addEventListener('input', function(){ fill(q.value); });
      q.addEventListener('keydown', function(e){ var o = opts(); if(e.key === 'ArrowDown' && o[0]){ e.preventDefault(); o[0].focus(); } else if(e.key === 'Enter'){ e.preventDefault(); if(o.length) pick(+o[0].dataset.i); } }); }
    else (on || opts()[0] || sel._dd).focus();
    pop.addEventListener('click', function(e){ var o = e.target.closest('.dd-o'); if(o && !o.disabled) pick(+o.dataset.i); });
    pop.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(true); return; }
      if(e.key === 'Tab'){ close(true); return; }
      if(!e.target.classList.contains('dd-o')) return;
      var o = opts(), i = o.indexOf(e.target);
      if(e.key === 'ArrowDown'){ e.preventDefault(); (o[i + 1] || o[i]).focus(); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); if(i > 0) o[i - 1].focus(); else if(q) q.focus(); }
      else if(e.key === 'Home'){ e.preventDefault(); o[0].focus(); } else if(e.key === 'End'){ e.preventDefault(); o[o.length - 1].focus(); }
      else if(e.key.length === 1 && /\S/.test(e.key)){ if(q){ q.focus(); } else { var c = e.key.toLowerCase(), nx = o.slice(i + 1).concat(o.slice(0, i + 1)).filter(function(x){ return x.textContent.trim().toLowerCase().charAt(0) === c; })[0]; if(nx) nx.focus(); } }
    });

  function close(refocus){ if(!pop) return; var s = cur; pop.remove(); pop = null; cur = null; if(s && s._dd){ s._dd.setAttribute('aria-expanded', 'false'); if(refocus && document.contains(s._dd)) s._dd.focus(); } }
  function pick(i){ var s = cur; if(!s) return; var ch = s.selectedIndex !== i; s.selectedIndex = i; close(true); sync(s); if(ch){ s.dispatchEvent(new Event('input', { bubbles: true })); s.dispatchEvent(new Event('change', { bubbles: true })); } }
  document.addEventListener('mousedown', function(e){ if(pop && !pop.contains(e.target) && !(cur && cur._dd.contains(e.target))) close(); }, true);
  window.addEventListener('scroll', function(e){ if(pop && !pop.contains(e.target)) close(); }, true);
  window.addEventListener('resize', function(){ close(); });
  var syncAll = function(){ Array.prototype.forEach.call(document.querySelectorAll('select.dd-n'), sync); if(cur && !document.contains(cur)) close(); };
  ['change', 'click', 'input', 'keyup'].forEach(function(ev){ document.addEventListener(ev, function(){ setTimeout(syncAll, 0); }); });
  function scan(root){ if(root.tagName === 'SELECT') enhance(root); else if(root.querySelectorAll) Array.prototype.forEach.call(root.querySelectorAll('select'), enhance); }
  new MutationObserver(function(ms){ ms.forEach(function(m){
    var t = m.target, sel = t.tagName === 'SELECT' ? t : (t.parentNode && t.parentNode.tagName === 'SELECT' ? t.parentNode : null);

  }); }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['disabled', 'selected'] });
  scan(document.body);
})();

/* ---- masonry (26 Nov): cards span as many 4px rows as their content, keep left-to-right order, and the last card in each column stretches so every column ends on the same line ---- */
(function(){
  if(!window.ResizeObserver) return;
  var GAP = 14, ROW = 4, pend = [];
  var isGrid = function(g){ return g && g.classList && (g.classList.contains('qgrid') || g.classList.contains('mas') || g.classList.contains('rowsal')); };
  function natural(c){ var r = c.getBoundingClientRect(), l = c.lastElementChild, cs = getComputedStyle(c);
    var h = l ? l.getBoundingClientRect().bottom - r.top + parseFloat(cs.paddingBottom) + parseFloat(cs.borderBottomWidth) + parseFloat(getComputedStyle(l).marginBottom || 0) : r.height;
    return Math.max(1, Math.ceil((h + GAP) / ROW)); }
  function fillRows(c, n){ var hid = c.querySelectorAll('.qx'); for(var i = 0; i < hid.length; i++){ hid[i].classList.add('qshow'); if(natural(c) > n){ hid[i].classList.remove('qshow'); break; } } }
  function setSpan(c, n){ var v = 'span ' + n; if(c.style.gridRowEnd !== v) c.style.gridRowEnd = v; }
  function px(c){ return (natural(c) * ROW) - GAP; }
  // My work: a plain grid whose rows line up; shorter cards in a row show more of their rows to match the tallest one (26 Nov)
  function rowsMode(g){
    Array.prototype.forEach.call(g.querySelectorAll('.qshow'), function(x){ x.classList.remove('qshow'); });
    var cs = Array.prototype.filter.call(g.children, function(c){ return c.offsetParent !== null; }), rows = {};
    cs.forEach(function(c){ if(c.style.gridRowEnd) c.style.gridRowEnd = ''; var t = Math.round(c.getBoundingClientRect().top); (rows[t] = rows[t] || []).push(c); });
    Object.keys(rows).forEach(function(t){ var grp = rows[t]; if(grp.length < 2) return; var tgt = Math.max.apply(null, grp.map(natural));
      grp.forEach(function(c){ if(natural(c) < tgt) fillRows(c, tgt); }); });
    hideMore(cs);
  }
  function hideMore(cs){ cs.forEach(function(c){ var b = c.querySelector('[data-qmore]'); if(b && !/fewer/i.test(b.textContent)){ var rest = c.querySelectorAll('.qx:not(.qshow)').length, all = +b.dataset.n || +(c.querySelector('.qn') || {}).textContent || 0, vis = c.querySelectorAll('.qrow:not(.qx),.ivrow:not(.qx),.qx.qshow').length; b.hidden = !rest && vis >= all; } }); }
  function balance(g){
    if(g.classList.contains('qgrid') || g.classList.contains('rowsal')) return rowsMode(g);
    var cs = Array.prototype.filter.call(g.children, function(c){ return c.offsetParent !== null; }); if(!cs.length) return;
    Array.prototype.forEach.call(g.querySelectorAll('.qshow'), function(x){ x.classList.remove('qshow'); });

    cs.forEach(function(c){ c.classList.remove('mfill'); });
    if(many) Object.keys(cols).forEach(function(k){ var x = cols[k], n = maxEnd - x.st; if(n > nat[x.i]){ fillRows(x.c, n); setSpan(x.c, n); x.c.classList.add('mfill'); } });

  new MutationObserver(scan).observe(document.body, { childList: true, subtree: true }); scan();
})();

    sh.hidden = !c || !document.querySelector('.side'); var b = document.getElementById('sideT'); if(b){ b.setAttribute('aria-pressed', c); b.setAttribute('aria-label', c ? 'Show sidebar' : 'Hide sidebar'); b.title = (c ? 'Show sidebar' : 'Hide sidebar') + ' (Ctrl+B)'; } }

// in-page Back (Sumit 26 Nov): inside the Recruit tab the browser Back is hidden and could leave Recruit's page, so the
// button only steps back through pages opened inside the pipeline (each pushState adds one), and hides at the start.
(function(){
  var depth = 0, btn = function(){ return document.getElementById('navBack'); }, show = function(){ var b = btn(); if(b) b.hidden = depth <= 0; };
  var push = history.pushState; history.pushState = function(){ depth++; var r = push.apply(history, arguments); show(); return r; };
