<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiring Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#8644f0;--brand-d:#6a2bd6;--brand-dd:#2b1160;--brand-l:#f1ebfe;--brand-ll:#f8f5ff;--brand-line:#dccdfb;
  --ink:#1b1530;--ink2:#3f3f3f;--muted:#5d5d5d;--line:#e6e2ef;--bg:#f6f4fb;--panel:#fbfaff;
  --ok:#1f7a00;--ok-l:#e7f6df;--warn:#9a5200;--warn-l:#fff1dc;--bad:#c8102e;--bad-l:#ffe8ec;
  --r:14px;--shadow:0 1px 2px rgba(27,21,48,.06),0 4px 14px rgba(27,21,48,.05);--shadow-h:0 2px 4px rgba(27,21,48,.08),0 10px 26px rgba(106,43,214,.14);--side:290px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand-d);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #b99bf7;outline-offset:2px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;font-weight:700;color:var(--muted);background:#fff}
.top{position:sticky;top:0;z-index:20;height:56px;background:linear-gradient(100deg,var(--brand-dd) 0%,#4a1fa8 55%,var(--brand) 100%);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;box-shadow:0 2px 10px rgba(43,17,96,.25)}
.logo{width:32px;height:32px;border-radius:10px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:17px}
.top .t1{font-weight:800;font-size:16px;line-height:1.1}.top .t2{font-size:11.5px;opacity:.8}
.top .sp{flex:1}
.me{display:flex;align-items:center;gap:10px;font-size:12.5px;text-align:right}
.me .av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:700}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:700;color:var(--ink);transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--brand-line);background:var(--brand-ll)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(134,68,240,.3)}.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 14px}.btn.ghost:hover{background:rgba(255,255,255,.22)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.shell{display:grid;grid-template-columns:var(--side) 1fr;height:calc(100vh - 56px)}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side .hd{padding:14px 14px 8px}
.side .hd h2{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side .list{overflow-y:auto;padding:4px 8px 14px;flex:1}
.home-link{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:700;color:var(--brand-d);text-align:left}
.home-link:hover,.home-link[aria-current=true]{background:#fff;box-shadow:var(--shadow)}
.grp{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-d);margin:12px 8px 6px}
.ji{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink)}
.ji:hover{background:#fff;box-shadow:var(--shadow)}
.ji[aria-current=true]{background:#fff;box-shadow:inset 3px 0 0 var(--brand),var(--shadow)}
.ji .dot{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--brand-l);color:var(--brand-d)}
.ji .tx{flex:1;min-width:0}
.ji .tt{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ji .ss{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ji .n{font-size:12px;font-weight:800;color:var(--muted)}
.main{overflow:auto;min-width:0;padding:18px 22px 30px}
.search{position:relative;display:block}
.search input{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:8px 34px 8px 36px;background:#fff}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(134,68,240,.12);outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .k{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink2)}
.chk input{accent-color:var(--brand)}
.hint{color:var(--muted);font-size:13px}
.loading{color:var(--muted);text-align:center;padding:60px 10px}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--brand-l);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:10px}@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--muted);text-align:center;padding:36px 16px;background:#fff;border:1.5px dashed var(--line);border-radius:var(--r)}
.card.err{border:1px solid #f5b8c3;background:var(--bad-l);color:var(--bad);font-weight:600;border-radius:var(--r);padding:16px}
.jh{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.jh h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.jh .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px;align-items:center}
.jh .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:800;background:var(--brand-l);color:var(--brand-d)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:16px 0 12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.tile small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile b{font-size:24px;font-weight:800;line-height:1.2}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.toolbar .search{flex:1;min-width:220px}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fc{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;background:#fff;border:1.5px solid var(--line);cursor:pointer;color:var(--ink)}
.fc i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.fc b{font-weight:800}
.fc[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.fc.clear{color:var(--brand-d);border-style:dashed}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:1 0 250px;max-width:360px;background:#efecf6;border-radius:var(--r);padding:10px;max-height:calc(100vh - 330px);display:flex;flex-direction:column}
.col h4{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.col h4 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.col h4 span{margin-left:auto;background:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.col .cards{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.cc{text-align:left;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);width:100%;transition:box-shadow .15s,transform .15s}
.cc:hover{box-shadow:var(--shadow-h);transform:translateY(-1px)}
.cc[aria-current=true]{border-color:var(--brand);border-left-color:var(--c);box-shadow:0 0 0 3px rgba(134,68,240,.18)}
.cc .nm{font-weight:800;font-size:14px}
.cc .s{font-size:12.5px;color:var(--ink2);margin-top:1px}
.cc .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--muted)}
.more{text-align:center;font-size:12.5px;color:var(--muted);padding:6px}
.tblw{overflow:auto;max-height:calc(100vh - 330px);border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);background:#fff}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--brand-ll);text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.r{cursor:pointer}.tbl tr.r:hover td{background:var(--brand-ll)}
.tbl tr[aria-current=true] td{background:var(--brand-l)}
.tbl td.nm{font-weight:800}
.stdot{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.stdot i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.hero{background:linear-gradient(135deg,#fff,var(--brand-ll));border:1px solid var(--brand-line);border-radius:18px;padding:22px 24px;margin-bottom:16px}
.hero h1{margin:0;font-size:24px;font-weight:800}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.job{text-align:left;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column;gap:6px}
.job:hover{box-shadow:var(--shadow-h);transform:translateY(-1px);border-color:var(--brand-line)}
.job .t{font-weight:800;font-size:15px;line-height:1.3}
.job .n b{font-size:22px;font-weight:800}.job .n span{color:var(--muted);font-size:12.5px;margin-left:5px}
.job .rec{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{position:fixed;inset:0;background:rgba(27,21,48,.32);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(700px,100%);background:var(--bg);z-index:31;box-shadow:-10px 0 40px rgba(27,21,48,.2);display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.dnav{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.dnav .sp{flex:1}
.dh{background:#fff;padding:14px 20px 12px;display:flex;gap:14px;align-items:flex-start}
.cav{flex:none;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px;background:var(--brand-l);color:var(--brand-d)}
.dh h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:11px 12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--brand-d);border-bottom-color:var(--brand)}
.db{overflow-y:auto;padding:16px 20px 40px;flex:1}
.nx{background:#fff;border:1px solid var(--brand-line);border-radius:14px;padding:14px;margin:0 0 14px;box-shadow:var(--shadow)}
.nx h4{margin:0 0 2px;font-size:14px}.nx .nxsteps{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.ok{background:var(--ok-l);border-color:#bfe3ad;color:var(--ok)}.btn.bad{background:var(--bad-l);border-color:#f5b8c3;color:var(--bad)}
.nxgate{background:var(--warn-l);border:1px solid #f3d3a5;color:#5a3500;border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nxform{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.nxform label{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.nxform input,.nxform select,.nxform textarea{font:inherit;font-weight:500;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
.nxform textarea{min-height:70px;resize:vertical}.nxform .row2{display:grid;grid-template-columns:1fr 140px;gap:10px}
.nxnote{font-size:12.5px;color:var(--ink2);background:var(--panel);border-radius:10px;padding:8px 10px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.kv div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.kv small{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.kv b{font-weight:700;word-break:break-word}
.sec{margin:18px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-d);font-weight:800}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-line}
.round{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.round .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.fb .c{white-space:pre-line;color:var(--ink2);font-size:13.5px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap;background:#ecebf2;color:#4a4560}
.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.pend{background:var(--warn-l);color:var(--warn)}.chip.bad{background:var(--bad-l);color:var(--bad)}.chip.br{background:var(--brand-l);color:var(--brand-d)}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--brand-line)}
.ev{position:relative;margin-bottom:12px}
.ev:before{content:"";position:absolute;left:-17px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 1px var(--brand-line)}
.ev .w{font-size:12px;color:var(--muted)}
.signin{max-width:860px;margin:40px auto;display:grid;grid-template-columns:1fr 1fr;border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(43,17,96,.14);background:#fff}
.signin .art{background:linear-gradient(150deg,var(--brand-dd),#5222b8 60%,var(--brand));color:#fff;padding:34px 30px;display:flex;flex-direction:column;gap:18px}
.signin .art h2{margin:0;font-size:27px;font-weight:800;line-height:1.2}
.signin .art ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:14px}
.signin .art li:before{content:"✓  "}
.signin .frm{padding:34px 30px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.signin .frm h3{margin:0;font-size:22px;font-weight:800}
.err{color:var(--bad);font-weight:600}
.jsel{display:none}
.rtabs{display:flex;gap:2px;flex-wrap:wrap;margin:14px 0 0;border-bottom:1.5px solid var(--line)}
.rtab{border:0;background:none;padding:9px 12px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;display:inline-flex;gap:7px;align-items:center;border-radius:8px 8px 0 0}
.rtab:hover{background:var(--brand-ll);color:var(--ink)}
.rtab[aria-selected=true]{color:var(--brand-d);border-bottom-color:var(--brand);background:var(--brand-ll)}
.rtab i{width:8px;height:8px;border-radius:50%;background:var(--c,#b8b3c7);flex:none}
.rpanel{padding:14px 2px 2px}
.rhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.stars{color:#f29a1f;letter-spacing:1px;font-size:15px}.stars span{color:#d9d4e6}
.big{font-size:20px;font-weight:800;color:var(--ink)}
.rt{font-size:14.5px;line-height:1.65;color:var(--ink)}
.rt p{margin:0 0 9px}.rt p:last-child{margin-bottom:0}
.rt b{font-weight:800;color:var(--brand-dd)}
.rt ul{margin:0 0 9px;padding-left:20px}.rt li{margin-bottom:4px}
.rt h5{margin:12px 0 6px;font-size:14px;font-weight:800;color:var(--brand-d)}
.qsec{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-d);margin:14px 0 8px}
.qcard{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;background:#fff}
.qtop{display:flex;gap:12px;align-items:flex-start}
.qtext{flex:1;font-weight:600;font-size:14px;color:var(--ink);white-space:pre-line}
.qscore{flex:none;text-align:right;min-width:74px}
.qscore b{display:inline-block;border-radius:8px;padding:2px 9px;font-weight:800;font-size:14px;color:#fff;background:var(--c)}
.qbar{height:5px;border-radius:99px;background:#eee9f6;margin-top:6px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--c)}
.qc{margin-top:8px;font-size:13.5px;color:var(--ink2);background:var(--panel);border-left:3px solid var(--brand-line);padding:6px 10px;border-radius:0 8px 8px 0;white-space:pre-line}
.sc2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sc2 .box{white-space:normal}
.sc2 .box h6{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
@media (max-width:640px){.sc2{grid-template-columns:1fr}}
.segs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.seg.full{display:flex;width:100%}.seg.full button{flex:1;padding:5px 6px;font-size:12.5px}
.seg button b{font-weight:800;margin-left:4px;opacity:.85}
.sbadge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:800}
.sbadge.open{background:var(--ok-l);color:var(--ok)}.sbadge.hold{background:var(--warn-l);color:var(--warn)}.sbadge.closed{background:#ecebf2;color:#4a4560}
.panel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12.5px}
.panel .pr{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.panel .pr b{color:var(--brand-d)}
.journey{display:flex;gap:0;overflow-x:auto;padding:4px 2px 12px;margin-bottom:8px}
.jstep{flex:1 0 74px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;font-size:11.5px;color:var(--muted)}
.jstep:before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:3px;background:var(--line);z-index:0}
.jstep:first-child:before{display:none}
.jstep.done:before,.jstep.cur:before,.jstep.stop:before,.jstep.hold:before{background:var(--brand)}
.jstep i{width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:11px;position:relative;z-index:1}
.jstep.done i{background:var(--brand);border-color:var(--brand);color:#fff}
.jstep.cur i{background:#fff;border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px rgba(134,68,240,.18)}
.jstep.stop i{background:var(--bad);border-color:var(--bad);color:#fff}
.jstep.hold i{background:var(--warn-bar,#f29a1f);border-color:#f29a1f;color:#fff}
.jstep.skip{opacity:.45}
.jstep b{display:block;margin-top:5px;color:var(--ink);font-size:12px}
.jstep.cur b{color:var(--brand-d)}.jstep.stop b{color:var(--bad)}
.ivday{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-d);margin:16px 2px 8px}

.ivrow:hover{box-shadow:var(--shadow-h)}
.ivrow .tm{font-weight:800;font-size:15px}.ivrow .tm small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}

.ivrow.st-up{--st:#8644f0}.ivrow.st-live{--st:#0f766e;background:#f2fbf9}
.ivrow.st-ok{--st:#2fb501;background:#f6fcf2}.ivrow.st-pend{--st:#f29a1f;background:#fffaf1}
.ivrow.st-late{--st:#c8102e;background:#fff5f7}.ivrow.st-none{--st:#b9b3c9;background:var(--panel)}
.ivlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:2px 2px 6px}
.ivlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:860px){.ivrow{grid-template-columns:70px 1fr}.ivrow .acts{grid-column:1/-1;justify-content:flex-start}}
@media (max-width:860px){.shell{grid-template-columns:1fr;height:auto}.side{display:none}.jsel{display:block;margin-bottom:12px}.jsel select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-weight:700}
  .main{padding:14px 14px 30px}.col{flex-basis:80vw;max-height:none}.tblw{max-height:none}.me .nm{display:none}.top .t2{display:none}.signin{grid-template-columns:1fr;margin:10px}.jh .acts{margin-left:0}}

<body>
<header class="top"><span class="logo" aria-hidden="true">L</span><div><div class="t1">Hiring Pipeline</div><div class="t2">Leegality Talent Acquisition · read-only</div></div><span class="sp"></span>
  <div class="me" id="meBox" hidden><div class="nm"><div id="meName"></div><div id="mePr" style="opacity:.8"></div></div><span class="av" id="meAv" aria-hidden="true"></span></div>
  <button class="btn ghost" id="signout" hidden>Sign out</button></header>
<div id="root"></div>
<div id="dr" hidden><div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" id="drawer"></aside></div>
<script>
(function(){
'use strict';
var CATALYST = 'https://project-rainfall-60065446090.development.catalystserverless.in';
var BASE = /^localhost$|^127\.0\.0\.1$/.test(location.hostname) ? location.origin : CATALYST;
var PAGE_URL = location.href.split('#')[0];
var API = BASE + '/server/hirepage/api/', AUTH = BASE + '/server/hirepage/auth/start?o=' + encodeURIComponent(location.origin) + '&r=' + encodeURIComponent(PAGE_URL);
var RC = 'https://recruit.zoho.in/recruit/leegality/EntityInfo.do?module=';
var FB_TAB = 'https://recruit.zoho.in/recruit/leegality/ShowTab.do?webTab=true&module=Interview%20Feedback';
var root = document.getElementById('root');
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
var S = { token: store('hire_t') || '', me: null, jobs: null, scope: 'mine', jobId: '', job: null, rows: null, q: '', jq: '', showAll: false, older: false, onlyMine: false, jstat: 'open', admin: false, page: 'home', ivs: null, view: store('hire_view') || 'board', stage: '', sort: { k: 'Updated_On', d: -1 }, visible: [], candId: '', cache: {} };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function initials(n){ var p = String(n || '').trim().split(/\s+/).filter(Boolean); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase(); }
function dt(iso, t){ if(!iso) return ''; var d = new Date(iso); if(isNaN(d)) return String(iso); return d.toLocaleString('en-IN', t ? { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' } : { day:'numeric', month:'short', year:'numeric' }); }
// recent = relative ("3h ago", "5d ago"); older than 2 weeks = the date ("12 Jul", or "12 Jul 2025" in another year)
function when(iso){ var d = new Date(iso); if(isNaN(d)) return ''; var s = (Date.now() - d) / 1000; if(s < 14 * 86400) return ago(iso); return d.toLocaleDateString('en-IN', d.getFullYear() === new Date().getFullYear() ? { day:'numeric', month:'short' } : { day:'numeric', month:'short', year:'numeric' }); }
function ago(iso){ var d = new Date(iso); if(isNaN(d)) return ''; var s = (Date.now() - d) / 1000; if(s < 3600) return Math.max(1, Math.round(s/60)) + 'm ago'; if(s < 86400) return Math.round(s/3600) + 'h ago'; return Math.round(s/86400) + 'd ago'; }
function yrs(n){ return n + (Number(n) === 1 ? ' yr' : ' yrs'); }
function loading(t){ return '<div class="loading"><span class="spin" aria-hidden="true"></span>' + esc(t) + '</div>'; }
var ICON_SEARCH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';

// stages (Candidate_Status picklist, 24 Nov 2026)
var STAGES = [
  ['screen','Screening','#7c6cf0',/^(new|waiting-for-information|waiting-for-evaluation|contacted|not contacted|attempted-to-contact|screening evaluation|qualified|submitted-to-hiring manager|approved by hiring manager)$/],
  ['assess','Assessment','#1d4ed8',/unberry|technical assessment|hackerearth test (shared|qualified)|mettl|barraiser|^assignment(?! reject)/],
  ['blitz','Blitz','#0e7490',/^blitz interview scheduled$/],
  ['r1','R1','#8644f0',/^(r1 interview|interview-scheduled|interview-in-progress|r1 - no show)/],
  ['r2','R2','#0f766e',/^(selected-r1>>r2|r2 interview|r2 - no show)/],
  ['r3','R3 / R4','#a3166a',/^(selected-r2>>r3|r3 interview|r3 - no show|r4 interview)/],
  ['vibe','Vibe / Ref','#b45309',/vibe check|reference check/],
  ['offer','Offer','#2f7d00',/^(selected-r3>>offer|offer discussion|to-be-offered|offer-made|offer-accepted)/],
  ['hired','Hired','#15803d',/^(hired|joined|converted|forward-to-onboarding)/],
  ['hold','On hold','#9a5200',/on hold|job-on-hold|contact in future|out of budget/],
  ['closed','Closed','#c8102e',/reject|not qualified|high ctc|offer-declined|offer-withdrawn|no-show$|drop-out/],
  ['out','Not in process','#8a849c',/./]
];
var HIDDEN = { closed: 1, out: 1 };
var NOT_IN = /^(associated|unqualified|junk candidate|duplicate profile|not looking for job change)$/i;
function stageOf(st){ var s = String(st || '').toLowerCase().trim(); if(!s || NOT_IN.test(s)) return 'out'; for(var i = 0; i < STAGES.length - 1; i++){ if(STAGES[i][3].test(s)) return STAGES[i][0]; } return 'out'; }
function stageMeta(k){ for(var i = 0; i < STAGES.length; i++) if(STAGES[i][0] === k) return STAGES[i]; return STAGES[STAGES.length-1]; }

function post(action, body){
  return fetch(API + action, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=UTF-8' }, body: JSON.stringify(Object.assign({}, body || {}, { _t: S.token })) })
    .then(function(r){ return r.json().catch(function(){ return { ok:false, error:'Bad reply (' + r.status + ')' }; }); })
    .then(function(j){ if(j && j.code === 'auth'){ signOut(); throw new Error('Please sign in again.'); } return j; });
}
function signOut(){ S.token = ''; S.me = null; S.jobs = null; store('hire_t', null); store('hire_me', null); closeDrawer(true); render(); }
document.getElementById('signout').onclick = signOut;
function setTop(){ var m = S.me || {}; document.getElementById('meBox').hidden = !S.token; document.getElementById('signout').hidden = !S.token;
  document.getElementById('meName').textContent = m.name || ''; document.getElementById('mePr').textContent = m.profile ? m.profile + ' profile' : ''; document.getElementById('meAv').textContent = initials(m.name || m.email); }

// routing: #job=<id>&c=<id> keeps your place on refresh and back/forward
function readHash(){ var h = new URLSearchParams(location.hash.replace(/^#/, '')); return { job: h.get('job') || '', c: h.get('c') || '' }; }
function writeHash(job, c){ var h = (job ? 'job=' + job : S.page === 'iv' ? 'view=iv' : '') + (c ? (h0() ? '&' : '') + 'c=' + c : ''); function h0(){ return job || S.page === 'iv'; } if((h ? '#' + h : '') === location.hash) return; history.pushState(null, '', location.pathname + location.search + (h ? '#' + h : '')); }
window.addEventListener('popstate', function(){ route(); });

// sign in (Sign in with Zoho, popup; falls back to a redirect back here)
function gotAuth(d){
  var err = document.getElementById('serr');
  if(!d.ok){ if(err) err.textContent = d.error || 'Sign-in failed.'; else S.authErr = d.error; return; }
  S.token = d.token; S.me = { email: d.email, name: d.name, profile: d.profile };
  store('hire_t', S.token); store('hire_me', JSON.stringify(S.me)); render();
}
if(location.hash.indexOf('#hire_auth=') === 0){ try{ var ha = JSON.parse(decodeURIComponent(location.hash.slice(11))); if(ha && ha.type === 'hire-auth') S.pending = ha; }catch(e){} history.replaceState(null, '', location.pathname + location.search); }
window.addEventListener('message', function(e){ if(e.origin !== BASE || !e.data || e.data.type !== 'hire-auth') return; gotAuth(e.data); });
function viewSignin(){
  root.innerHTML = '<div class="signin"><div class="art"><h2>Every open role, every candidate, one view.</h2><ul><li>Pipeline by stage for each open job</li><li>Each interviewer’s feedback side by side</li><li>Full history of a candidate</li><li>You see exactly what Recruit lets you see</li></ul></div>' +
    '<div class="frm"><h3>Sign in with Zoho</h3><p class="hint" style="margin:0">Uses your Zoho Recruit login. The first time, a small Zoho window asks you to allow access. After that this page signs you in by itself.</p>' +
    '<button class="btn primary" id="zgo" style="padding:12px 18px;font-size:15px">Continue with Zoho</button><div class="err" id="serr" role="alert">' + esc(S.authErr || '') + '</div></div></div>';
  document.getElementById('zgo').onclick = function(){ var w = window.open(AUTH, 'hire_auth', 'width=520,height=700'); if(!w) document.getElementById('serr').textContent = 'Your browser blocked the sign-in window. Allow pop-ups for this page and try again.'; };
}

// shell: jobs sidebar + main area
function shell(){
  root.innerHTML = '<div class="shell"><aside class="side" aria-label="Jobs"><div class="hd"><h2 id="sideTitle">Jobs</h2><label class="search">' + ICON_SEARCH + '<input id="jq" type="search" placeholder="Find a job" aria-label="Find a job" value="' + esc(S.jq) + '"></label>' +
    '<div class="segs"><div class="seg full" role="group" aria-label="Whose jobs" id="sgm"></div><div class="seg full" role="group" aria-label="Job status" id="sgs"></div></div></div><nav class="list" id="jl"></nav></aside><main class="main" id="main"></main></div>';
  document.getElementById('jq').oninput = function(){ S.jq = this.value; drawSide(); if(S.page === 'home') viewHome(); };
  drawSide();
}
function scoped(){ return S.jobs.filter(function(x){ return !S.onlyMine || x.mine; }); }
function visibleJobs(){ var q = S.jq.trim().toLowerCase(); return scoped().filter(function(x){ return x.group === S.jstat && (!q || [x.title, x.dept, x.recruiters.join(' '), x.manager, x.status].join(' ').toLowerCase().indexOf(q) >= 0); }); }
var GROUPS = [['open','Open'],['hold','On hold'],['closed','Closed']];
function statusBadge(x){ return '<span class="sbadge ' + esc(x.group) + '">' + esc(x.group === 'open' ? 'Open' : x.status || (x.group === 'hold' ? 'On hold' : 'Closed')) + '</span>'; }
function jobInitials(t){ return String(t || '').replace(/\(.*?\)/g, '').split(/[\s\-–\/]+/).filter(Boolean).slice(0, 2).map(function(w){ return w[0]; }).join('').toUpperCase(); }
function drawSide(){
  var el = document.getElementById('jl'); if(!el) return;
  var list = visibleJobs();
  var nMine = S.jobs.filter(function(x){ return x.mine; }).length;
  document.getElementById('sideTitle').textContent = 'Jobs';
  var sgm = document.getElementById('sgm'); sgm.innerHTML = '<button data-m="1" aria-pressed="' + S.onlyMine + '">My jobs<b>' + nMine + '</b></button><button data-m="0" aria-pressed="' + !S.onlyMine + '">All jobs<b>' + S.jobs.length + '</b></button>';
  var sc = scoped(), sgs = document.getElementById('sgs'); sgs.innerHTML = GROUPS.map(function(g){ return '<button data-g="' + g[0] + '" aria-pressed="' + (S.jstat === g[0]) + '">' + g[1] + '<b>' + sc.filter(function(x){ return x.group === g[0]; }).length + '</b></button>'; }).join('');
  sgm.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ S.onlyMine = b.dataset.m === '1'; store('hire_mine', S.onlyMine ? '1' : '0'); drawSide(); if(S.page === 'home') viewHome(); if(S.page === 'iv') viewInterviews(); }; });
  sgs.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ S.jstat = b.dataset.g; drawSide(); if(S.page === 'home') viewHome(); }; });
  var item = function(x){ return '<button class="ji" data-j="' + esc(x.id) + '" aria-current="' + (x.id === S.jobId) + '" title="' + esc(x.title) + '"><span class="dot" aria-hidden="true">' + esc(jobInitials(x.title)) + '</span><span class="tx"><span class="tt">' + esc(x.title) + '</span><span class="ss">' + esc(x.group === 'open' ? (x.dept || '') : (x.status || '') + (x.dept ? ' · ' + x.dept : '')) + '</span></span><span class="n">' + (x.candidates || 0).toLocaleString('en-IN') + '</span></button>'; };
  var mine = list.filter(function(x){ return x.mine; }), rest = list.filter(function(x){ return !x.mine; });
  el.innerHTML = '<button class="home-link" id="hm" aria-current="' + (S.page === 'home') + '">⌂ Overview</button><button class="home-link" id="ivl" aria-current="' + (S.page === 'iv') + '">🗓 Interviews</button>' + (list.length ? (!S.onlyMine && mine.length && rest.length ? '<div class="grp">My jobs</div>' + mine.map(item).join('') + '<div class="grp">Other jobs</div>' + rest.map(item).join('') : list.map(item).join(''))
    : '<div class="hint" style="padding:12px">' + (S.jq ? 'No jobs match.' : S.onlyMine ? 'No ' + (S.jstat === 'open' ? 'open' : S.jstat === 'hold' ? 'on-hold' : 'closed') + ' jobs where you are the recruiter or hiring manager. Try “All jobs”.' : 'No jobs here.') + '</div>');
  el.querySelectorAll('[data-j]').forEach(function(b){ b.onclick = function(){ openJob(b.dataset.j); }; });
  document.getElementById('hm').onclick = goHome;
  document.getElementById('ivl').onclick = goInterviews;
}
function jobSelect(){
  return '<div class="jsel"><select id="jsel" aria-label="Choose a job"><option value="">Overview</option><option value="__iv"' + (S.page === 'iv' ? ' selected' : '') + '>🗓 Interviews</option>' + visibleJobs().map(function(x){ return '<option value="' + esc(x.id) + '"' + (x.id === S.jobId ? ' selected' : '') + '>' + esc(x.title) + ' (' + (x.candidates || 0) + ')</option>'; }).join('') + '</select></div>';
}
function bindJobSelect(){ var s = document.getElementById('jsel'); if(s) s.onchange = function(){ if(this.value === '__iv') goInterviews(); else if(this.value) openJob(this.value); else goHome(); }; }

function loadJobs(){
  root.innerHTML = loading('Loading open jobs…');
  post('jobs').then(function(j){ if(!j.ok){ root.innerHTML = '<div style="padding:20px"><div class="card err">' + esc(j.error) + '</div></div>'; return; } S.jobs = j.jobs; S.admin = !!j.admin; S.scope = S.admin ? 'all' : 'mine'; var sm = store('hire_mine'); S.onlyMine = sm === '1' ? true : sm === '0' ? false : !S.admin; shell(); route(true); })
    .catch(function(e){ root.innerHTML = '<div style="padding:20px"><div class="card err">' + esc(e.message) + '</div></div>'; });
}
function route(first){
  if(!S.jobs) return;
  var h = readHash(), job = h.job;
  if(location.hash.indexOf('view=iv') >= 0){ S.jobId = ''; if(S.page !== 'iv' || !S.ivs) goInterviews(true); if(h.c && h.c !== S.candId) openCandidate(h.c, true); else if(!h.c) closeDrawer(true); return; }
  if(first && !job){ var last = store('hire_job'); if(last && S.jobs.some(function(x){ return x.id === last; })){ job = last; history.replaceState(null, '', location.pathname + location.search + '#job=' + last); } }
  if(job && S.jobs.some(function(x){ return x.id === job; })){
    if(job !== S.jobId || !S.rows) openJob(job, false, true, h.c);
    else if(h.c && h.c !== S.candId) openCandidate(h.c, true);
    else if(!h.c) closeDrawer(true);
  } else { S.jobId = ''; S.page = 'home'; drawSide(); viewHome(); closeDrawer(true); }
}
function goHome(){ S.jobId = ''; S.page = 'home'; store('hire_job', null); writeHash('', ''); closeDrawer(true); drawSide(); viewHome(); }

function viewHome(){
  var main = document.getElementById('main'); if(!main) return;
  var list = visibleJobs().slice().sort(function(a,b){ return (b.mine - a.mine) || String(b.opened).localeCompare(String(a.opened)); });
  var total = list.reduce(function(s,x){ return s + (x.candidates || 0); }, 0);
  var first = String((S.me && S.me.name) || '').split(' ')[0];
  var gl = { open: 'open', hold: 'on-hold', closed: 'closed (last 12 months)' }[S.jstat];
  main.innerHTML = jobSelect() + '<div class="hero"><h1>' + (first ? 'Hi ' + esc(first) + ' 👋' : 'Welcome') + '</h1><div class="hint" style="margin-top:4px">' + (S.onlyMine ? 'Your ' : 'All ') + list.length + ' ' + gl + ' job' + (list.length === 1 ? '' : 's') + ' · ' + total.toLocaleString('en-IN') + ' candidates associated. Pick a job to see its pipeline, or open <a href="#view=iv" id="hiv">Interviews</a> for this week’s schedule. Press <span class="kbd">/</span> to search.</div></div>' +
    (list.length ? '<div class="jobs">' + list.map(function(x){ return '<button class="job" data-j="' + esc(x.id) + '"><div class="t">' + esc(x.title) + '</div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' + (x.dept ? '<span class="tag">' + esc(x.dept) + '</span>' : '') + statusBadge(x) + (x.mine && !S.onlyMine ? '<span class="tag" style="background:#e7f6df;color:#1f7a00">Mine</span>' : '') + '<span class="hint">Opened ' + esc(dt(x.opened)) + '</span></div><div class="n"><b>' + (x.candidates || 0).toLocaleString('en-IN') + '</b><span>candidates · ' + esc(x.positions || '?') + ' position' + (x.positions == 1 ? '' : 's') + '</span></div><div class="rec">' + esc(x.recruiters.join(', ')) + '</div></button>'; }).join('') + '</div>'
      : '<div class="empty">' + (S.jq ? 'No jobs match.' : S.onlyMine ? 'No ' + gl + ' jobs where you are the recruiter or hiring manager. Switch to “All jobs” in the sidebar.' : 'No ' + gl + ' jobs.') + '</div>');
  main.querySelectorAll('[data-j]').forEach(function(b){ b.onclick = function(){ openJob(b.dataset.j); }; });
  var hiv = document.getElementById('hiv'); if(hiv) hiv.onclick = function(e){ e.preventDefault(); goInterviews(); };
  bindJobSelect();
}

// interviews: 2 days back to 7 days ahead, across jobs (My jobs filter applies)
function goInterviews(fromRoute){
  S.page = 'iv'; S.jobId = ''; if(fromRoute !== true) writeHash('', ''); closeDrawer(true); drawSide();
  var main = document.getElementById('main');
  if(S.ivs && !S.ivFresh){ viewInterviews(); return; }
  main.innerHTML = jobSelect() + loading('Loading interviews…'); bindJobSelect();
  post('interviews', { fresh: !!S.ivFresh }).then(function(j){ S.ivFresh = false; if(S.page !== 'iv') return; if(!j.ok){ main.innerHTML = jobSelect() + '<div class="card err">' + esc(j.error) + '</div>'; bindJobSelect(); return; } S.ivs = j.interviews; S.ivAt = Date.now(); viewInterviews(); })
    .catch(function(e){ main.innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; });
}
function viewInterviews(){
  var main = document.getElementById('main'); if(!main || !S.ivs) return;
  var mineIds = {}; S.jobs.forEach(function(x){ if(x.mine) mineIds[x.id] = 1; });
  var list = S.ivs.filter(function(v){ return !S.onlyMine || mineIds[v.jobId]; });
  var q = (S.ivq || '').trim().toLowerCase();
  if(q) list = list.filter(function(v){ return [v.cand, v.job, v.round, v.panel.join(' '), v.owner].join(' ').toLowerCase().indexOf(q) >= 0; });
  var now = Date.now(), upcoming = list.filter(function(v){ return new Date(v.end || v.start) >= now; }), past = list.filter(function(v){ return new Date(v.end || v.start) < now; }).reverse();
  var pendingFb = past.filter(function(v){ return v.fb && v.fb.done < v.fb.total; }).length;
  var today = list.filter(function(v){ return dayKey(v.start) === dayKey(new Date().toISOString()); }).length;
  S.visible = list.map(function(v){ return v.candId; });
  var row = function(v, isPast){
    var st = ivState(v), fb = '<span class="chip ' + st.chip + '">' + esc(st.label) + '</span>';
    return '<div class="ivrow st-' + st.k + (isPast ? ' past' : '') + '" tabindex="0" data-c="' + esc(v.candId) + '" data-j="' + esc(v.jobId) + '"><div class="tm">' + esc(timeOf(v.start)) + '<small>' + esc(dayLabel(v.start)) + '</small></div>' +
      '<div style="min-width:0"><div class="who">' + esc(v.cand) + ' <span class="chip br" style="margin-left:4px">' + esc(String(v.round).replace(/ Interview$/,'')) + '</span>' + (v.status ? ' <span class="chip">' + esc(v.status) + '</span>' : '') + '</div>' +
      '<div class="sub">' + esc(v.job) + (v.panel.length ? ' · Panel: ' + esc(v.panel.join(', ')) : ' · <span style="color:var(--warn)">no interviewer set</span>') + (v.owner ? ' · Owner: ' + esc(v.owner) : '') + '</div></div>' +

  if(locked) h += '<label>Reason to skip the evaluation (required, 10+ characters)<textarea id="nxbypass" placeholder="The evaluation is not filed yet. Saved as Evaluation Bypass Reason."></textarea></label>';
  h += '<div class="nxnote">Changes the status on <b>' + esc(f.jobTitle) + '</b> from <b>' + esc(f.status) + '</b> to <b>' + esc(st.to) + '</b>, the same as Change Status in Recruit, so any status emails to the candidate go out as usual.</div>';
  return h + '<div style="display:flex;gap:8px"><button class="btn ' + (st.tone === 'bad' ? 'bad' : 'primary') + '" id="nxgo">Confirm: ' + esc(st.label) + '</button><button class="btn" id="nxcx">Cancel</button></div></div>';
}
function doStep(k){
  var f = S.nx, st = f && f.steps.filter(function(x){ return x.k === k; })[0]; if(!st) return;
  var g = function(id){ var el = document.getElementById(id); return el ? el.value : ''; };
  var body = { candId: f.candId, jobId: f.jobId, step: k, expect: f.status, reason: g('nxreason'), bypass: g('nxbypass'), start: g('nxwhen'), minutes: g('nxmin') };
  if(st.reason && body.reason.trim().length < 5){ toastMsg('Please give a reason'); return; }
  if(st.gate && !st.gateOk && body.bypass.trim().length < 10){ toastMsg('Give a reason to skip the evaluation (10+ characters)'); return; }
  if(st.kind === 'schedule' && !body.start){ toastMsg('Pick the date and time'); return; }
  var b = document.getElementById('nxgo'); b.disabled = true; b.textContent = 'Saving in Recruit…';
  post('move', body).then(function(r){
    if(!r.ok){ toastMsg(r.error || 'Could not save'); if(r.stale){ loadNext(); return; } b.disabled = false; b.textContent = 'Confirm: ' + st.label; return; }
    toastMsg('Done: ' + st.label);
    (S.rows || []).forEach(function(x){ if(x.id === f.candId && String(S.jobId) === String(f.jobId)) x.Candidate_Status = r.status; });
    S.ivFresh = true;
    if(S.page !== 'iv' && S.jobId) try{ drawJob(); }catch(e){}
    openCandidate(f.candId, true);
  }).catch(function(e){ toastMsg(e.message); b.disabled = false; b.textContent = 'Confirm: ' + st.label; });
}
function fileEval(b){
  b.disabled = true; b.textContent = 'Filing…';
  post('fileeval', { ivId: b.dataset.fileeval }).then(function(r){
    if(!r.ok){ toastMsg(r.error || 'Could not file'); b.disabled = false; b.textContent = 'File evaluation now'; return; }
    toastMsg('Filing in Recruit with ' + (r.with || 'the submitted feedback'));
    b.textContent = '✓ Filing started'; setTimeout(loadNext, 6000);
  }).catch(function(e){ toastMsg(e.message); b.disabled = false; b.textContent = 'File evaluation now'; });
}

function render(){
  if(S.pending){ var pd = S.pending; S.pending = null; if(pd.ok){ gotAuth(pd); return; } S.authErr = pd.error || 'Sign-in failed.'; }
  try{ S.me = S.me || JSON.parse(store('hire_me') || 'null'); }catch(e){}
  setTop();
  if(!S.token){ viewSignin(); return; }
  loadJobs();
}
render();
})();
</script>
</body>
