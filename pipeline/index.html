<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hiring Pipeline</title>
<style>body{margin:0;background:#f6f4fb;font:15px system-ui;color:#5d5d5d;display:grid;place-items:center;height:100vh}</style></head>
<body>Loading…
<script>
// Loader: GitHub Pages lets browsers cache pages for 10 minutes, so this tiny page always fetches the latest app.
fetch('app.html?v=' + Date.now(), { cache: 'no-store' }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(h){ document.open(); document.write(h); document.close(); })
  .catch(function(e){ document.body.textContent = 'Could not load the page (' + e.message + '). Please refresh.'; });
</script></body></html>
