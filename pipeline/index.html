<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiring Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#8644f0;--brand-d:#6a2bd6;--brand-dd:#2b1160;--brand-l:#f1ebfe;--brand-ll:#f8f5ff;--brand-line:#dccdfb;
  --ink:#1b1530;--ink2:#3f3f3f;--muted:#5d5d5d;--line:#e4e0ee;--bg:#f5f3fa;--card:#fff;
  --ok:#1f7a00;--ok-l:#e7f6df;--ok-bar:#2fb501;--warn:#9a5200;--warn-l:#fff1dc;--warn-bar:#f29a1f;--bad:#c8102e;--bad-l:#ffe8ec;
  --r:14px;--shadow:0 1px 2px rgba(27,21,48,.06),0 4px 14px rgba(27,21,48,.05);--shadow-h:0 2px 4px rgba(27,21,48,.08),0 10px 26px rgba(106,43,214,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-d);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,var(--brand-dd) 0%,#4a1fa8 55%,var(--brand) 100%);color:#fff;box-shadow:0 2px 10px rgba(43,17,96,.25)}
.top .in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
.brandmark{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:18px}
.brandmark .t1{font-weight:800;font-size:17px;line-height:1.1}.brandmark .t2{font-size:12px;opacity:.8;font-weight:500}
.top .sp{flex:1}
.me{display:flex;align-items:center;gap:10px;font-size:13px}
.me .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:700}
.me .pr{opacity:.8;font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:700;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--brand-line);background:var(--brand-ll)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(134,68,240,.3)}.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 14px}.btn.ghost:hover{background:rgba(255,255,255,.22)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:focus-visible,input:focus-visible,.job:focus-visible,.cc:focus-visible,.tab:focus-visible{outline:3px solid #b99bf7;outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:22px 20px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.hint{color:var(--muted);font-size:13.5px}.err{color:var(--bad);font-weight:600}
.card.err{border-color:#f5b8c3;background:var(--bad-l)}
.loading{color:var(--muted);text-align:center;padding:44px 10px}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--brand-l);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:10px}@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--muted);text-align:center;padding:36px 16px;background:#fff;border:1.5px dashed var(--line);border-radius:var(--r)}
h2.pg{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:10px 14px 10px 40px;background:#fff}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(134,68,240,.12);outline:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
.chk input{accent-color:var(--brand)}
/* jobs */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.job{text-align:left;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s,border-color .15s;display:flex;flex-direction:column;gap:8px}
.job:hover{border-color:var(--brand-line);box-shadow:var(--shadow-h);transform:translateY(-1px)}
.job .t{font-weight:800;font-size:16px;line-height:1.3}
.job .d{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink2)}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:800;background:var(--brand-l);color:var(--brand-d)}
.tag.grey{background:#eeedf3;color:#4a4560}
.job .n{display:flex;align-items:baseline;gap:6px;margin-top:4px}.job .n b{font-size:24px;font-weight:800}.job .n span{color:var(--muted);font-size:13px}
.job .rec{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* board */
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stages{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.st{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:800;background:#fff;border:1.5px solid var(--line)}
.st i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 272px;background:#efecf6;border-radius:var(--r);padding:10px;max-height:calc(100vh - 250px);display:flex;flex-direction:column}
.col h4{margin:2px 4px 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px;color:var(--ink)}
.col h4 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.col h4 span{margin-left:auto;background:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.col .cards{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.cc{text-align:left;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);width:100%}
.cc:hover{border-color:var(--brand-line);border-left-color:var(--c);box-shadow:var(--shadow-h)}
.cc .nm{font-weight:800;font-size:14.5px}
.cc .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.cc .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.more{text-align:center;font-size:12.5px;color:var(--muted);padding:6px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(27,21,48,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:31;box-shadow:-10px 0 40px rgba(27,21,48,.2);display:flex;flex-direction:column}
.dh{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;gap:14px;align-items:flex-start}
.dh .cav{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--brand-l);color:var(--brand-d)}
.dh h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.dh .x{margin-left:auto}
.tabs{display:flex;gap:4px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--brand-d);border-bottom-color:var(--brand)}
.db{overflow-y:auto;padding:18px 20px 40px;flex:1}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kv div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kv small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kv b{font-weight:700;word-break:break-word}
.sec{margin:18px 0 8px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-d);font-weight:800}
.round{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.round .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.round .rh b{font-size:15px}
.fb{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.fb .who{font-weight:700}
.fb .c{white-space:pre-line;color:var(--ink2);font-size:13.5px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap;background:#ecebf2;color:#4a4560}
.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.pend{background:var(--warn-l);color:var(--warn)}.chip.bad{background:var(--bad-l);color:var(--bad)}.chip.br{background:var(--brand-l);color:var(--brand-d)}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--brand-line)}
.ev{position:relative;margin-bottom:12px}
.ev:before{content:"";position:absolute;left:-17px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 1px var(--brand-line)}
.ev .w{font-size:12.5px;color:var(--muted)}
.ev .f{font-size:13.5px}
/* sign in */
.signin{max-width:860px;margin:32px auto;display:grid;grid-template-columns:1fr 1fr;border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(43,17,96,.14);background:#fff}
.signin .art{background:linear-gradient(150deg,var(--brand-dd),#5222b8 60%,var(--brand));color:#fff;padding:36px 32px;display:flex;flex-direction:column;gap:20px}
.signin .art h2{margin:0;font-size:28px;font-weight:800;line-height:1.2}
.signin .art ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:14px}
.signin .art li:before{content:"✓  "}
.signin .frm{padding:36px 32px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.signin .frm h3{margin:0;font-size:22px;font-weight:800}
.zbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 18px;font-size:15px}
@media (max-width:720px){.signin{grid-template-columns:1fr;margin:8px auto}.me .nm,.me .pr,.brandmark .t2{display:none}.col{flex-basis:84vw;max-height:none}.wrap{padding:16px 16px 60px}}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="brandmark"><span class="logo" aria-hidden="true">L</span><div><div class="t1">Hiring Pipeline</div><div class="t2">Leegality Talent Acquisition · read-only</div></div></div><span class="sp"></span>
  <div class="me" id="meBox" hidden><div style="text-align:right"><div class="nm" id="meName"></div><div class="pr" id="mePr"></div></div><span class="av" id="meAv" aria-hidden="true"></span></div>
  <button class="btn ghost" id="signout" hidden>Sign out</button></div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<div id="dr" hidden><div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" id="drawer"></aside></div>
<script>
(function(){
'use strict';
var CATALYST = 'https://project-rainfall-60065446090.development.catalystserverless.in';
var BASE = /^localhost$|^127\.0\.0\.1$/.test(location.hostname) ? location.origin : CATALYST;
var API = BASE + '/server/hirepage/api/', AUTH = BASE + '/server/hirepage/auth/start?o=' + encodeURIComponent(location.origin) + '&r=' + encodeURIComponent(location.href.split('#')[0]);
var RC = 'https://recruit.zoho.in/recruit/leegality/EntityInfo.do?module=';
var app = document.getElementById('app');
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
var S = { token: store('hire_t') || '', me: null, jobs: null, job: null, rows: null, q: '', showAll: false, jq: '' };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function initials(n){ var p = String(n || '').trim().split(/\s+/).filter(Boolean); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase(); }
function dt(iso, withTime){ if(!iso) return ''; var d = new Date(iso); if(isNaN(d)) return String(iso); return d.toLocaleString('en-IN', withTime ? { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' } : { day:'numeric', month:'short', year:'numeric' }); }
function ago(iso){ var d = new Date(iso); if(isNaN(d)) return ''; var s = (Date.now() - d) / 1000; if(s < 3600) return Math.max(1, Math.round(s/60)) + 'm ago'; if(s < 86400) return Math.round(s/3600) + 'h ago'; return Math.round(s/86400) + 'd ago'; }
function yrs(n){ return n + (Number(n) === 1 ? ' yr' : ' yrs'); }
function loading(t){ return '<div class="loading"><span class="spin" aria-hidden="true"></span>' + esc(t) + '</div>'; }
var ICON_SEARCH = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';

// ----- stage columns (Candidate_Status picklist, 24 Nov 2026) -----
var STAGES = [
  ['screen','New / Screening','#7c6cf0',/^(new|waiting-for-information|waiting-for-evaluation|contacted|not contacted|attempted-to-contact|screening evaluation|qualified|submitted-to-hiring manager|approved by hiring manager)$/],
  ['assess','Assessment','#1d4ed8',/unberry|technical assessment|hackerearth test (shared|qualified)|mettl|barraiser|^assignment(?! reject)/],
  ['blitz','Blitz','#0e7490',/^blitz interview scheduled$/],
  ['r1','R1','#8644f0',/^(r1 interview|interview-scheduled|interview-in-progress|r1 - no show)/],
  ['r2','R2','#0f766e',/^(selected-r1>>r2|r2 interview|r2 - no show)/],
  ['r3','R3 / R4','#a3166a',/^(selected-r2>>r3|r3 interview|r3 - no show|r4 interview)/],
  ['vibe','Vibe / Reference','#b45309',/vibe check|reference check/],
  ['offer','Offer','#2f7d00',/^(selected-r3>>offer|offer discussion|to-be-offered|offer-made|offer-accepted)/],
  ['hired','Hired','#15803d',/^(hired|joined|converted|forward-to-onboarding)/],
  ['hold','On hold','#9a5200',/on hold|job-on-hold|contact in future|out of budget/],
  ['closed','Closed','#c8102e',/reject|not qualified|high ctc|offer-declined|offer-withdrawn|no-show$|drop-out/],
  ['out','Not in process','#8a849c',/./]
];
var HIDDEN = { closed: 1, out: 1 };
var NOT_IN = /^(associated|unqualified|junk candidate|duplicate profile|not looking for job change)$/i;
function stageOf(st){ var s = String(st || '').toLowerCase().trim(); if(!s || NOT_IN.test(s)) return 'out'; for(var i = 0; i < STAGES.length - 1; i++){ if(STAGES[i][3].test(s)) return STAGES[i][0]; } return 'out'; }
function stageMeta(k){ for(var i = 0; i < STAGES.length; i++) if(STAGES[i][0] === k) return STAGES[i]; return STAGES[STAGES.length-1]; }

function post(action, body){
  return fetch(API + action, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=UTF-8' }, body: JSON.stringify(Object.assign({}, body || {}, { _t: S.token })) })
    .then(function(r){ return r.json().catch(function(){ return { ok:false, error:'Bad reply (' + r.status + ')' }; }); })
    .then(function(j){ if(j && j.code === 'auth'){ signOut(); throw new Error('Please sign in again.'); } return j; });
}
function signOut(){ S.token = ''; S.me = null; store('hire_t', null); store('hire_me', null); closeDrawer(); render(); }
document.getElementById('signout').onclick = signOut;
function setTop(){
  var m = S.me || {}; document.getElementById('meBox').hidden = !S.token; document.getElementById('signout').hidden = !S.token;
  document.getElementById('meName').textContent = m.name || ''; document.getElementById('mePr').textContent = m.profile ? m.profile + ' profile' : ''; document.getElementById('meAv').textContent = initials(m.name || m.email);
}

// ----- sign in (Sign in with Zoho, popup) -----
function gotAuth(d){
  var err = document.getElementById('serr');
  if(!d.ok){ if(err) err.textContent = d.error || 'Sign-in failed.'; else S.authErr = d.error; return; }
  S.token = d.token; S.me = { email: d.email, name: d.name, profile: d.profile };
  store('hire_t', S.token); store('hire_me', JSON.stringify(S.me)); render();
}
// sign-in came back without a popup: the session is in the URL fragment (never sent to a server)
if(location.hash.indexOf('#hire_auth=') === 0){ try{ var ha = JSON.parse(decodeURIComponent(location.hash.slice(11))); if(ha && ha.type === 'hire-auth'){ S.pending = ha; } }catch(e){} history.replaceState(null, '', location.pathname + location.search); }
window.addEventListener('message', function(e){
  if(e.origin !== BASE || !e.data || e.data.type !== 'hire-auth') return;
  gotAuth(e.data); return;
  var err = document.getElementById('serr');
  if(!e.data.ok){ if(err) err.textContent = e.data.error || 'Sign-in failed.'; return; }
  S.token = e.data.token; S.me = { email: e.data.email, name: e.data.name, profile: e.data.profile };
  store('hire_t', S.token); store('hire_me', JSON.stringify(S.me)); render();
});
function viewSignin(){
  app.innerHTML = '<div class="signin"><div class="art"><h2>Every open role, every candidate, one view.</h2><ul><li>Pipeline by stage for each open job</li><li>Each interviewer’s feedback side by side</li><li>Full history of a candidate</li><li>You see exactly what Recruit lets you see</li></ul></div>' +
    '<div class="frm"><h3>Sign in with Zoho</h3><p class="hint" style="margin:0">Uses your Zoho Recruit login. The first time, a small Zoho window asks you to allow access. After that this page signs you in by itself.</p>' +
    '<button class="btn primary zbtn" id="zgo">Continue with Zoho</button><div class="err" id="serr" role="alert">' + esc(S.authErr || '') + '</div></div></div>';
  document.getElementById('zgo').onclick = function(){
    var w = window.open(AUTH, 'hire_auth', 'width=520,height=700');
    if(!w) document.getElementById('serr').textContent = 'Your browser blocked the sign-in window. Allow pop-ups for this page and try again.';
  };
}

// ----- jobs -----
function loadJobs(){
  app.innerHTML = loading('Loading open jobs…');
  post('jobs').then(function(j){ if(!j.ok){ app.innerHTML = '<div class="card err">' + esc(j.error) + '</div>'; return; } S.jobs = j.jobs; viewJobs(); })
    .catch(function(e){ app.innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; });
}
function viewJobs(){
  var jobs = S.jobs.slice().sort(function(a,b){ return String(b.opened).localeCompare(String(a.opened)); });
  var total = jobs.reduce(function(s,x){ return s + (x.candidates || 0); }, 0);
  app.innerHTML = '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2 class="pg">Open jobs</h2><div class="hint">' + jobs.length + ' in progress · ' + total.toLocaleString('en-IN') + ' candidates associated</div></div></div>' +
    '<div class="bar"><label class="search">' + ICON_SEARCH + '<input id="jq" type="search" placeholder="Search job, team or recruiter" aria-label="Search jobs" value="' + esc(S.jq) + '"></label></div><div class="jobs" id="jl"></div>';
  function draw(){
    var q = S.jq.trim().toLowerCase();
    var list = jobs.filter(function(x){ return !q || [x.title, x.dept, x.recruiters.join(' '), x.manager].join(' ').toLowerCase().indexOf(q) >= 0; });
    document.getElementById('jl').innerHTML = list.length ? list.map(function(x){
      return '<button class="job" data-j="' + esc(x.id) + '"><div class="t">' + esc(x.title) + '</div><div class="d">' + (x.dept ? '<span class="tag">' + esc(x.dept) + '</span>' : '') + (x.positions ? '<span class="tag grey">' + esc(x.positions) + ' position' + (x.positions == 1 ? '' : 's') + '</span>' : '') + (x.opened ? '<span>Opened ' + esc(dt(x.opened)) + '</span>' : '') + '</div>' +
        '<div class="n"><b>' + (x.candidates || 0).toLocaleString('en-IN') + '</b><span>candidates</span></div><div class="rec">' + esc(x.recruiters.join(', ')) + '</div></button>';
    }).join('') : '<div class="empty">No jobs match.</div>';
    document.querySelectorAll('[data-j]').forEach(function(b){ b.onclick = function(){ openJob(b.dataset.j); }; });
  }
  draw();
  document.getElementById('jq').oninput = function(){ S.jq = this.value; draw(); };
}

// ----- job board -----
function openJob(id, fresh){
  S.job = (S.jobs || []).filter(function(x){ return x.id === id; })[0] || { id: id, title: 'Job' };
  app.innerHTML = loading('Loading candidates' + (S.job.candidates > 400 ? ' (' + S.job.candidates.toLocaleString('en-IN') + ', this can take a few seconds)' : '') + '…');
  post('job', { jobId: id, fresh: !!fresh }).then(function(j){ if(!j.ok){ app.innerHTML = '<div class="card err">' + esc(j.error) + '</div>'; return; } S.rows = j.candidates; S.cachedAt = j.cachedAt; viewBoard(); })
    .catch(function(e){ app.innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; });
}
function viewBoard(){
  var job = S.job, rows = S.rows;
  rows.forEach(function(r){ r._st = stageOf(r.Candidate_Status); });
  var counts = {}; rows.forEach(function(r){ counts[r._st] = (counts[r._st] || 0) + 1; });
  var active = rows.filter(function(r){ return !HIDDEN[r._st]; }).length;
  app.innerHTML = '<div class="crumb"><button class="btn sm" id="bk">← Open jobs</button><a href="' + RC + 'JobOpenings&id=' + esc(job.id) + '" target="_blank" rel="noopener">Open in Recruit ↗</a><span class="sp" style="flex:1"></span><span class="hint">Updated ' + esc(ago(S.cachedAt) || 'now') + '</span><button class="btn sm" id="rf">Refresh</button></div>' +
    '<h2 class="pg" style="margin-top:10px">' + esc(job.title) + '</h2><div class="hint">' + active + ' in process · ' + rows.length + ' associated' + (job.dept ? ' · ' + esc(job.dept) : '') + '</div>' +
    '<div class="stages">' + STAGES.filter(function(s){ return counts[s[0]]; }).map(function(s){ return '<span class="st" style="--c:' + s[2] + '"><i></i>' + esc(s[1]) + ' ' + counts[s[0]] + '</span>'; }).join('') + '</div>' +
    '<div class="bar"><label class="search">' + ICON_SEARCH + '<input id="cq" type="search" placeholder="Search name, status, company or title" aria-label="Search candidates" value="' + esc(S.q) + '"></label><label class="chk"><input type="checkbox" id="all"' + (S.showAll ? ' checked' : '') + '> Show closed and not in process</label></div><div class="board" id="bd"></div>';
  function draw(){
    var q = S.q.trim().toLowerCase();
    var list = rows.filter(function(r){ return (S.showAll || !HIDDEN[r._st]) && (!q || [r.Full_Name, r.Candidate_Status, r.Current_Employer, r.Current_Job_Title, r.City, r.Source].join(' ').toLowerCase().indexOf(q) >= 0); });
    var cols = STAGES.filter(function(s){ return S.showAll || !HIDDEN[s[0]]; });
    document.getElementById('bd').innerHTML = cols.map(function(s){
      var items = list.filter(function(r){ return r._st === s[0]; }).sort(function(a,b){ return String(b.Updated_On || '').localeCompare(String(a.Updated_On || '')); });
      var shown = items.slice(0, 150);
      return '<section class="col" style="--c:' + s[2] + '"><h4><i></i>' + esc(s[1]) + '<span>' + items.length + '</span></h4><div class="cards">' + (shown.map(function(r){
        var meta = []; if(r.Experience_in_Years != null) meta.push(yrs(r.Experience_in_Years)); if(r.Unberry_Verdict) meta.push('Unberry: ' + r.Unberry_Verdict); if(r.Updated_On) meta.push(ago(r.Updated_On));
        return '<button class="cc" style="--c:' + s[2] + '" data-c="' + esc(r.id) + '"><div class="nm">' + esc(r.Full_Name) + '</div><div class="s">' + esc(r.Candidate_Status) + '</div>' +
          (r.Current_Job_Title || r.Current_Employer ? '<div class="s" style="color:var(--muted)">' + esc([r.Current_Job_Title, r.Current_Employer].filter(Boolean).join(' · ')) + '</div>' : '') + '<div class="m">' + meta.map(esc).join(' · ') + '</div></button>';
      }).join('') || '<div class="more">None</div>') + (items.length > shown.length ? '<div class="more">+' + (items.length - shown.length) + ' more, use search</div>' : '') + '</div></section>';
    }).join('');
    document.querySelectorAll('[data-c]').forEach(function(b){ b.onclick = function(){ openCandidate(b.dataset.c); }; });
  }
  draw();
  document.getElementById('cq').oninput = function(){ S.q = this.value; draw(); };
  document.getElementById('all').onchange = function(){ S.showAll = this.checked; draw(); };
  document.getElementById('bk').onclick = function(){ S.q = ''; viewJobs(); };
  document.getElementById('rf').onclick = function(){ openJob(job.id, true); };
}

// ----- candidate drawer -----
var dr = document.getElementById('dr'), drawer = document.getElementById('drawer');
function closeDrawer(){ dr.hidden = true; document.body.style.overflow = ''; }
document.getElementById('scrim').onclick = closeDrawer;
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !dr.hidden) closeDrawer(); });
function openCandidate(id){
  dr.hidden = false; document.body.style.overflow = 'hidden';
  drawer.innerHTML = '<div class="db">' + loading('Loading candidate…') + '</div>';
  post('candidate', { id: id }).then(function(j){ if(!j.ok){ drawer.innerHTML = '<div class="db"><div class="card err">' + esc(j.error) + '</div><p><button class="btn" id="dx">Close</button></p></div>'; document.getElementById('dx').onclick = closeDrawer; return; } viewCandidate(j, 'over'); })
    .catch(function(e){ drawer.innerHTML = '<div class="db"><div class="card err">' + esc(e.message) + '</div></div>'; });
}
function chipFor(st){ var k = stageOf(st); var c = k === 'closed' ? 'bad' : k === 'hold' ? 'pend' : k === 'hired' || k === 'offer' ? 'ok' : k === 'out' ? '' : 'br'; return '<span class="chip ' + c + '">' + esc(st || '—') + '</span>'; }
function viewCandidate(j, tab){
  var c = j.candidate;
  var head = '<div class="dh"><span class="cav" aria-hidden="true">' + esc(initials(c.Full_Name)) + '</span><div style="min-width:0"><h3 id="dTitle">' + esc(c.Full_Name) + '</h3><div class="hint">' + esc([c.Current_Job_Title, c.Current_Employer].filter(Boolean).join(' · ')) + '</div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' + (j.jobs || []).map(function(x){ return '<span class="hint" style="font-size:12.5px">' + esc(x.title) + ':</span> ' + chipFor(x.status); }).join(' ') + '</div></div>' +
    '<div class="x" style="display:flex;gap:8px"><a class="btn sm" href="' + RC + 'Candidates&id=' + esc(c.id) + '" target="_blank" rel="noopener">Recruit ↗</a><button class="btn sm" id="dx" aria-label="Close">✕</button></div></div>';
  var nFb = (j.feedback || []).length;
  var tabs = [['over','Overview'],['rounds','Rounds & feedback' + (nFb ? ' (' + nFb + ')' : '')],['hist','History']];
  var h = head + '<div class="tabs" role="tablist">' + tabs.map(function(t){ return '<button class="tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + esc(t[1]) + '</button>'; }).join('') + '</div><div class="db">';
  if(tab === 'over'){
    var F = [['Candidate ID','Candidate_ID'],['Experience','Experience_in_Years',' yrs'],['Notice period','Notice_Period'],['City','City'],['Source','Source'],['Owner','Owner'],['Email','Email'],['Mobile','Mobile'],['Qualification','Highest_Qualification_Held'],['Current salary','Current_Salary'],['Expected salary','Expected_Salary'],['Evaluation','Evaluation_Status'],['Rejection reason','Rejection_Reason'],['Withdrawal reason','Withdrawal_Reason'],['Added','Created_Time','',1],['Last updated','Updated_On','',1]];
    h += '<div class="kv">' + F.filter(function(f){ return c[f[1]] != null && c[f[1]] !== ''; }).map(function(f){ var v = f[3] ? dt(c[f[1]], true) : f[2] ? yrs(c[f[1]]) : String(c[f[1]]); return '<div><small>' + esc(f[0]) + '</small><b>' + esc(v) + '</b></div>'; }).join('') + '</div>';
    var ub = [['Resume','Unberry_Resume_Score','Unberry_Resume_Result'],['Assessment','Unberry_Assessment_Score','Unberry_Assessment_Result'],['AI interview','Unberry_Interview_Score','Unberry_Interview_Result']].filter(function(u){ return c[u[1]] != null || c[u[2]]; });
    if(ub.length || c.Unberry_Verdict) h += '<div class="sec">Unberry</div><div class="kv">' + (c.Unberry_Verdict ? '<div><small>Verdict</small><b>' + esc(c.Unberry_Verdict) + '</b></div>' : '') + ub.map(function(u){ return '<div><small>' + u[0] + '</small><b>' + esc(c[u[1]] != null ? c[u[1]] : '') + (c[u[2]] ? ' · ' + esc(c[u[2]]) : '') + '</b></div>'; }).join('') + '</div>';
    if(c.Skill_Set) h += '<div class="sec">Skills</div><div class="card" style="padding:12px 14px">' + esc(c.Skill_Set) + '</div>';
    var notes = [c.Recruiter_Notes, c.Other_notes, c.Additional_Info].filter(Boolean);
    if(notes.length) h += '<div class="sec">Notes</div>' + notes.map(function(n){ return '<div class="card" style="padding:12px 14px;white-space:pre-line;margin-bottom:8px">' + esc(n) + '</div>'; }).join('');
  } else if(tab === 'rounds'){
    if(j.notes && j.notes.feedback) h += '<div class="card hint" style="margin-bottom:10px">' + esc(j.notes.feedback) + '</div>';
    var ivs = j.interviews || [];
    if(!ivs.length) h += '<div class="empty">No interviews yet.</div>';
    ivs.forEach(function(v){
      var fb = (j.feedback || []).filter(function(f){ return f.ivId === String(v.id); });
      h += '<div class="round"><div class="rh"><b>' + esc(v.name || v.round || 'Interview') + '</b>' + (v.status ? '<span class="chip">' + esc(v.status) + '</span>' : '') + '<span class="hint" style="margin-left:auto">' + esc(dt(v.start, true)) + '</span></div>' +
        '<div class="hint">' + esc([v.job, v.interviewers.length ? 'Panel: ' + v.interviewers.join(', ') : ''].filter(Boolean).join(' · ')) + '</div>' +
        (fb.length ? fb.map(function(f){ var st = f.status === 'Submitted' || f.status === 'Filed in Recruit' ? 'ok' : 'pend';
          return '<div class="fb"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="who">' + esc(f.who) + '</span><span class="chip ' + st + '">' + esc(f.status === 'Pending' ? 'To fill' : f.status) + '</span>' + (f.rec ? '<span class="chip br">' + esc(f.rec) + '</span>' : '') + (f.rating ? '<span class="hint">' + esc(f.rating) + '/5</span>' : '') + '</div>' + (f.comments ? '<div class="c">' + esc(f.comments) + '</div>' : '') + '</div>'; }).join('')
          : '<div class="fb hint">No panel feedback recorded for this round.</div>') + '</div>';
    });
  } else {
    if(j.notes && j.notes.history) h += '<div class="card hint">' + esc(j.notes.history) + '</div>';
    var ev = (j.history || []).filter(function(e){ return e.fields && e.fields.length || e.action; });
    h += ev.length ? '<div class="tl">' + ev.map(function(e){ return '<div class="ev"><div class="w">' + esc(dt(e.at, true)) + (e.by ? ' · ' + esc(e.by) : '') + '</div><div class="f"><b>' + esc(e.action) + '</b>' + (e.fields || []).map(function(f){ return '<div>' + esc(f.f) + ': ' + (f.from ? '<s style="color:var(--muted)">' + esc(f.from) + '</s> → ' : '') + '<b>' + esc(f.to == null ? '' : f.to) + '</b></div>'; }).join('') + '</div></div>'; }).join('') + '</div>'
      : (j.notes && j.notes.history ? '' : '<div class="empty">No history.</div>');
  }
  drawer.innerHTML = h + '</div>';
  document.getElementById('dx').onclick = closeDrawer;
  drawer.querySelectorAll('.tab').forEach(function(b){ b.onclick = function(){ viewCandidate(j, b.dataset.t); }; });
}

function render(){
  if(S.pending){ var pd = S.pending; S.pending = null; if(pd.ok){ gotAuth(pd); return; } S.authErr = pd.error || 'Sign-in failed.'; }
  try{ S.me = S.me || JSON.parse(store('hire_me') || 'null'); }catch(e){}
  setTop();
  if(!S.token){ viewSignin(); return; }
  loadJobs();
}
render();
})();
</script>
</body>
